# Defense evaluation configuration.
# Usage: uv run -m defense.evaluate defense/config/ppo/eval_defenses.yaml

device: auto

data:
  h5_path: trajectory_data/ppo/gradients_test.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 8
  latent_dim: 1024
  encoder_hidden_dim: 2048
  stride: 8
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  dropout: 0.1

eval:
  checkpoint: ckpts/trace/ppo/base/best_model.pt
  num_sequences: 100
  enable_fid: false

output:
  save_dir: ckpts/trace/ppo/defense/base/eval_results

defenses:
  # Gradient quantization
  - type: quantization
    n_bits: 8
  - type: quantization
    n_bits: 4
  - type: quantization
    n_bits: 2
  - type: quantization
    n_bits: 1

  # Gradient pruning (top-k by magnitude)
  - type: pruning
    keep_ratio: 0.9
  - type: pruning
    keep_ratio: 0.5
  - type: pruning
    keep_ratio: 0.1

  # Gaussian noise injection
  - type: noise
    sigma: 0.001
  - type: noise
    sigma: 0.01
  - type: noise
    sigma: 0.1

  # DP-SGD
  - type: dpsgd
    max_grad_norm: 1.0
    target_epsilon: 10.0
    target_delta: 1.0e-5
    num_steps: 1000
    sample_rate: 0.01
  - type: dpsgd
    max_grad_norm: 1.0
    target_epsilon: 5.0
    target_delta: 1.0e-5
    num_steps: 1000
    sample_rate: 0.01
  - type: dpsgd
    max_grad_norm: 1.0
    target_epsilon: 1.0
    target_delta: 1.0e-5
    num_steps: 1000
    sample_rate: 0.01

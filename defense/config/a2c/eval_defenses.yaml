# Defense Evaluation Configuration
# Usage: uv run -m defense.evaluate defense/config/eval_defenses.yaml
#
# Evaluates reconstruction quality under various gradient defense
# mechanisms and produces a comparison table + chart.

device: auto

data:
  h5_path: trajectory_data/a2c/gradients_test.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 8
  latent_dim: 1024
  encoder_hidden_dim: 2048
  stride: 8 # Non-overlapping for evaluation
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  dropout: 0.1

eval:
  checkpoint: ckpts/trace/a2c/base/best_model.pt
  num_sequences: 20
  enable_fid: false

output:
  save_dir: ckpts/trace/a2c/defense/base/eval_results

defenses:
  # --- Gradient Quantization (standard in distributed RL) ---
  - type: quantization
    n_bits: 8 # 256 levels — low compression

  - type: quantization
    n_bits: 4 # 16 levels — moderate compression

  - type: quantization
    n_bits: 2 # 4 levels — aggressive compression

  - type: quantization
    n_bits: 1 # 1-bit sign compression

  # --- Gradient Pruning (top-k sparsification) ---
  - type: pruning
    keep_ratio: 0.9 # Keep 90%, prune 10%

  - type: pruning
    keep_ratio: 0.5 # Keep 50%, prune 50%

  - type: pruning
    keep_ratio: 0.1 # Keep 10%, prune 90%

  # --- Gaussian Noise Injection ---
  - type: noise
    sigma: 0.001

  - type: noise
    sigma: 0.01

  - type: noise
    sigma: 0.1

  # DP-SGD
  - type: dpsgd # Low privacy
    max_grad_norm: 1.0
    target_epsilon: 10.0
    target_delta: 1.0e-5
    num_steps: 1000
    sample_rate: 0.01

  - type: dpsgd # Medium privacy
    max_grad_norm: 1.0
    target_epsilon: 5.0
    target_delta: 1.0e-5
    num_steps: 1000
    sample_rate: 0.01

  - type: dpsgd # Strong privacy
    max_grad_norm: 1.0
    target_epsilon: 1.0
    target_delta: 1.0e-5
    num_steps: 1000
    sample_rate: 0.01

# Ablation: Sequence length T=64
# Note: interleaved sequence length = 2*T = 128 > max_seq_len=64 (learned pos embeddings).
# use_rope: true is REQUIRED here — RoPE has no fixed-length constraint.
# Usage: uv run -m attacker.training.train ./attacker/config/a2c/ablation/train_t64.yaml

device: auto

data:
  h5_path: trajectory_data/a2c/gradients_train_augmented.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 64
  latent_dim: 1024
  encoder_hidden_dim: 1024
  stride: 8
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true
  use_rope: true 

training:
  num_epochs: 50
  batch_size: 2
  accumulation_steps: 8
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6

  gradient_noise_scale: 0.0

  scheduled_sampling_start: 0.1
  scheduled_sampling_end: 0.8
  scheduled_sampling_warmup: 5

  rollout_steps: 4
  rollout_weight: 0.5

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01
  temporal_weight: 0.0
  lpips_weight: 0.2
  lpips_net: vgg

output:
  save_dir: ckpts/trace/a2c/ablation/t64

eval:
  enabled: true
  h5_path: trajectory_data/a2c/gradients_test.h5
  num_sequences: 100

wandb:
  enabled: true
  project: trace
  name: ablation-t64
  group: a2c/ablation
  entity: gradinversion
  tags: ["a2c", "ablation", "t64"]

# Ablation: Policy + Value heads only
# Tests whether the output heads alone carry sufficient information.
# Usage: uv run -m attacker.training.train ./attacker/config/ablation/train_heads_only.yaml

device: auto

data:
  h5_path: trajectory_data/a2c/gradients_train_augmented.h5
  gradient_layers:
    # Policy head (512 -> 5)
    - policy.weight
    - policy.bias
    # Value head (512 -> 1)
    - value.weight
    - value.bias

model:
  model_type: autoregressive
  sequence_length: 8
  latent_dim: 1024
  encoder_hidden_dim: 1024
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true

training:
  num_epochs: 50
  batch_size: 8
  accumulation_steps: 2
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6

  gradient_noise_scale: 0.0

  scheduled_sampling_start: 0.1
  scheduled_sampling_end: 0.8
  scheduled_sampling_warmup: 5

  rollout_steps: 3
  rollout_weight: 0.5

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01
  temporal_weight: 0.0
  lpips_weight: 0.2
  lpips_net: vgg

output:
  save_dir: ckpts/trace/a2c/ablation/heads_only

eval:
  enabled: true
  h5_path: trajectory_data/a2c/gradients_test.h5
  num_sequences: 100

wandb:
  enabled: true
  project: trace
  name: ablation-heads-only
  group: a2c/ablation
  entity: gradinversion
  tags: ["a2c", "ablation", "heads-only"]

device: auto

data:
  h5_path: trajectory_data/a2c/gradients_test.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 8
  stride: 2
  latent_dim: 1024
  encoder_hidden_dim: 2048
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true

eval:
  checkpoint: ckpts/trace/a2c/base/best_model.pt
  num_sequences: 100
  enable_fid: true
  teacher_forcing: true

output:
  save_dir: ckpts/trace/a2c/base/eval_results

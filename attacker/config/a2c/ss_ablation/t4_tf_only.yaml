# SS Ablation: T=4, pure teacher forcing (no scheduled sampling, no rollout)
# Baseline condition — expected to show flat AR PSNR across timesteps (exposure bias).
# Usage: uv run -m attacker.training.train attacker/config/a2c/ss_ablation/t4_tf_only.yaml

device: auto

data:
  h5_path: trajectory_data/a2c/gradients_train_augmented.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 4
  latent_dim: 256
  encoder_hidden_dim: 256
  stride: 2
  num_transformer_layers: 2
  num_heads: 4
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true

training:
  num_epochs: 20
  batch_size: 16
  accumulation_steps: 1
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 2
  min_lr: 1e-6

  gradient_noise_scale: 0.0

  scheduled_sampling_start: 0.0
  scheduled_sampling_end: 0.0 # disabled: pure teacher forcing
  scheduled_sampling_warmup: 2

  rollout_steps: 0 # disabled
  rollout_weight: 0.0

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01
  temporal_weight: 0.0
  lpips_weight: 0.2
  lpips_net: vgg

output:
  save_dir: ckpts/trace/a2c/ss_ablation/t4_tf_only

eval:
  enabled: true
  h5_path: trajectory_data/a2c/gradients_test.h5
  num_sequences: 100

wandb:
  enabled: true
  project: trace
  name: ss-ablation-t4-tf-only
  group: a2c/ss_ablation
  entity: gradinversion
  tags: ["a2c", "ss-ablation", "t4", "tf-only"]

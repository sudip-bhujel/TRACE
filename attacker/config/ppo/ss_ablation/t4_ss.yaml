# SS Ablation: T=4, scheduled sampling only (no rollout loss)
# Tests whether SS alone reduces exposure bias without rollout.
# Usage: uv run -m attacker.training.train attacker/config/ppo/ss_ablation/t4_ss.yaml

device: auto

data:
  h5_path: trajectory_data/ppo/gradients_train_augmented.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 4
  latent_dim: 256
  encoder_hidden_dim: 256
  stride: 2
  num_transformer_layers: 2
  num_heads: 4
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true

training:
  num_epochs: 20
  batch_size: 16
  accumulation_steps: 1
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 2
  min_lr: 1e-6

  gradient_noise_scale: 0.0

  scheduled_sampling_start: 0.1
  scheduled_sampling_end: 0.8
  scheduled_sampling_warmup: 2

  rollout_steps: 0              # disabled: SS only, no rollout
  rollout_weight: 0.0

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01
  temporal_weight: 0.0
  lpips_weight: 0.2
  lpips_net: vgg

output:
  save_dir: ckpts/trace/ppo/ss_ablation/t4_ss

eval:
  enabled: true
  h5_path: trajectory_data/ppo/gradients_test.h5
  num_sequences: 100

wandb:
  enabled: true
  project: trace
  name: ss-ablation-t4-ss
  group: ppo/ss_ablation
  entity: gradinversion
  tags: ["ppo", "ss-ablation", "t4", "ss-only"]

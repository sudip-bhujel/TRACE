# Preprocess first with attacker.tools.aggregate_gradients or attacker/scripts/aggregate.sh.
# Then train with attacker/scripts/train.sh; no base checkpoint is required.
device: auto

aggregation:
  group_size: 8
  train_source: trajectory_data/ppo/gradients_train.h5
  test_source: trajectory_data/ppo/gradients_test.h5

data:
  h5_path: trajectory_data/ppo/gradients_train_agg8.h5
  gradient_dim: 936102
  split_by_episode: true

model:
  model_type: autoregressive
  num_actions: 5
  sequence_length: 8  # Eight aggregates cover 64 original steps.
  latent_dim: 1024
  encoder_hidden_dim: 2048
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true
  pretrained_checkpoint: ""

training:
  num_epochs: 50
  batch_size: 8
  accumulation_steps: 3
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4
  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6
  scheduled_sampling_start: 0.1
  scheduled_sampling_end: 0.8
  scheduled_sampling_warmup: 5
  rollout_steps: 3
  rollout_weight: 0.5

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01
  temporal_weight: 0.0
  lpips_weight: 0.2
  lpips_net: vgg

output:
  save_dir: ckpts/trace/ppo/aggregation/agg8_scratch

eval:
  enabled: true
  h5_path: trajectory_data/ppo/gradients_test_agg8.h5
  num_sequences: 39  # All non-overlapping sequences in the current 4,022-step test capture.
  stride: 8

wandb:
  enabled: true
  project: trace
  name: ppo-agg8-scratch
  group: ppo/aggregation
  entity: gradinversion
  tags: [ppo, aggregation, agg8, scratch]

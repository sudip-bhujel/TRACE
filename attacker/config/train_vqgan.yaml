# VQ-GAN Gradient Inversion Training Configuration
# Phase 2: Train gradient → token prediction with frozen VQ-VAE decoder
#
# PREREQUISITE: Train VQ-VAE first with:
#   uv run -m attacker.train_vqvae ./attacker/config/train_vqvae.yaml
#
# Usage: uv run -m attacker.train ./attacker/config/train_vqgan.yaml

data:
  h5_path: trajectory_data/gradients_108_augmented.h5
  # Encoder-only: first 76K dims = 85% variance, 0.47 img correlation
  # (FC layer: 3.28M dims but 0.00003 variance, 0.05 correlation = noise)
  gradient_dim: 140395

model:
  encoder_type: residual
  decoder_type: vqgan
  latent_dim: 4096
  sequence_length: 8
  stride: 4
  num_transformer_layers: 6
  num_heads: 8
  dropout: 0.1
  use_flash_attention: true
  # VQ-GAN decoder settings
  vqvae_checkpoint: ckpts/vqvae/best_model.pt
  # Gumbel-Softmax τ annealing: linearly decay from start → end
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.5

loss:
  # Rebalanced: stronger pixel supervision, moderate token guidance
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01 # reduced from 0.1 to prevent explosion
  temporal_weight: 0.001
  lpips_weight: 1.0
  token_weight: 0.5

training:
  num_epochs: 100
  batch_size: 4
  accumulation_steps: 12 # must be divisible by world_size (6 GPUs)
  learning_rate: 5e-5
  weight_decay: 1e-5
  num_workers: 4
  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6

output:
  save_dir: ckpts/attacker_vqgan

eval:
  enabled: true
  h5_path: trajectory_data/eval_tf_108.h5
  num_sequences: 5

wandb:
  enabled: true
  project: gradient-inversion
  name: vqgan-spatial-v2
  entity: gradinversion
  tags: ["vqgan", "spatial-predictor", "tau-annealing"]

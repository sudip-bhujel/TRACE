# Temporal Gradient Inversion Training Configuration - U-Net Decoder
# Usage: uv run -m attacker.train ./attacker/config/train_unet.yaml
#
# Changes from train.yaml:
# - Uses U-Net decoder for better spatial detail preservation
# - Lower MSE weight (0.5) to reduce blur
# - Higher LPIPS weight (0.4) for sharper perceptual quality

device: auto

data:
  h5_path: trajectory_data/gradients_108_augmented.h5
  gradient_dim: 1048576 # 1M

model:
  sequence_length: 8
  latent_dim: 1024
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual # Options: basic, residual, bottleneck, gated, hierarchical, moe
  decoder_type: unet # U-Net for skip connections and better spatial details
  encoder_hidden_dims: [4096, 2048, 1024] # Only used for 'basic' encoder
  dropout: 0.1
  use_flash_attention: true

training:
  num_epochs: 100
  batch_size: 8
  accumulation_steps: 8 # Effective batch size = batch_size * accumulation_steps * num_gpus
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  # Learning rate schedule
  lr_schedule: cosine # Options: none, cosine
  warmup_epochs: 5
  min_lr: 1e-6

  # Regularization
  gradient_noise_scale: 0.0 # Add noise to gradients for regularization

loss:
  mse_weight: 0.5 # Lower to reduce blur
  l1_weight: 0.5
  action_weight: 0.1
  temporal_weight: 0.1 # Temporal smoothness loss
  lpips_weight: 0.4 # Higher perceptual loss for sharper details
  lpips_net: vgg # Options: vgg, alex, squeeze

output:
  save_dir: ckpts/attacker_unet

eval:
  enabled: true
  h5_path: trajectory_data/eval_tf_108.h5
  num_sequences: 20

wandb:
  enabled: true
  project: gradient-inversion
  name: attacker-train-unet
  entity: gradinversion
  tags: ["unet-decoder", "high-lpips", "low-mse", "1024-latent"]

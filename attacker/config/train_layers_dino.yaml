# Temporal Gradient Inversion Training Configuration (Layer Selection)
# Uses the most effective gradient layers identified by analyze_gradients.py
# Usage: python -m attacker.train ./attacker/config/train_layers_dino.yaml

device: auto

data:
  h5_path: trajectory_data/gradients_108_augmented.h5
  # Layer-name selection (replaces gradient_dim)
  # Selected based on highest variance + strongest image correlation
  gradient_layers:
    # Conv1 (3->32, k=8, s=4): highest variance, strong brightness correlation
    - encoder.0.0.weight
    - encoder.0.0.bias
    - encoder.0.2.weight # BatchNorm scale
    - encoder.0.2.bias
    - encoder.0.2.running_var
    - encoder.0.2.running_mean # BN running stat
    # Conv2 (32->64, k=4, s=2): strong contrast correlation
    - encoder.1.0.weight
    - encoder.1.0.bias
    - encoder.1.2.running_var # strongest contrast correlation (0.59)
    - encoder.1.2.weight
    - encoder.1.2.running_mean # BN running stat
    - encoder.1.2.bias
    # Conv3 (64->64, k=3, s=1): high contrast correlation
    - encoder.2.0.weight
    - encoder.2.0.bias
    - encoder.2.2.weight # BN scale
    - encoder.2.2.bias
    - encoder.2.2.running_var
    # Policy head: high variance
    - policy.weight
    - policy.bias
    # Value head: high variance (var=0.094), similar to policy head
    - value.weight

model:
  sequence_length: 8
  latent_dim: 1024
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  encoder_hidden_dims: [4096, 2048, 1024]
  dropout: 0.1
  use_flash_attention: true

training:
  num_epochs: 100
  batch_size: 8
  accumulation_steps: 6
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6

  gradient_noise_scale: 0.0

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.1
  temporal_weight: 0.1
  lpips_weight: 0.2
  lpips_net: vgg
  dino_weight: 0.1 # DINOv2 semantic loss for unseen object reconstruction
  dino_model: dinov2_vits14

output:
  save_dir: ckpts/attacker_layers_dino

eval:
  enabled: true
  h5_path: trajectory_data/eval_tf_108.h5
  num_sequences: 20

wandb:
  enabled: true
  project: gradient-inversion
  name: attacker-train-layers-dino
  entity: gradinversion
  tags:
    [
      "layer-selection",
      "80k-dims",
      "encoder+policy+value",
      "1024-latent",
      "dino",
    ]

# Ablation: Remove temporal smoothness loss (keep MSE, L1, action, LPIPS)
# Usage: uv run -m attacker.training.train ./attacker/config/ablation/train_no_temporal.yaml

device: auto

data:
  h5_path: trajectory_data/ppo/gradients_train_augmented.h5
  gradient_dim: 936102

model:
  model_type: autoregressive
  sequence_length: 8
  latent_dim: 1024
  encoder_hidden_dim: 1024
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true

training:
  num_epochs: 50
  batch_size: 8
  accumulation_steps: 2
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6

  gradient_noise_scale: 0.0

  scheduled_sampling_start: 0.0
  scheduled_sampling_end: 0.5
  scheduled_sampling_warmup: 5

  rollout_steps: 2
  rollout_weight: 0.3

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.01
  temporal_weight: 0.0
  lpips_weight: 0.2
  lpips_net: vgg

output:
  save_dir: ckpts/autoregressive/no_temp/ablation/no_temporal

eval:
  enabled: true
  h5_path: trajectory_data/ppo/gradients_test.h5
  num_sequences: 100

wandb:
  enabled: true
  project: gradient-inversion
  name: ablation-no-temporal
  group: ablation-notemp
  entity: gradinversion
  tags: ["ar", "ablation", "no-temporal"]

# Temporal Gradient Inversion Training Configuration
# Usage: uv run -m attacker.training.train ./attacker/config/train.yaml

device: auto

data:
  h5_path: trajectory_data/small/gradients_train_augmented.h5
  gradient_dim: 936102

model:
  sequence_length: 8
  latent_dim: 1024
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual # Options: basic, residual, bottleneck, gated, hierarchical, moe
  decoder_type: residual # Options: basic, residual, unet, style
  encoder_hidden_dims: [4096, 2048, 1024] # Only used for 'basic' encoder
  dropout: 0.1
  use_flash_attention: true

training:
  num_epochs: 50
  batch_size: 8
  accumulation_steps: 8 # Effective batch size = batch_size * accumulation_steps * num_gpus
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4
  gradient_mask_ratio: 0.25 # Temporal dropout: mask 25% of timesteps

  # Learning rate schedule
  lr_schedule: cosine # Options: none, cosine
  warmup_epochs: 5
  min_lr: 1e-6

  # Regularization
  gradient_noise_scale: 0.0 # Add noise to gradients for regularization

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.1
  temporal_weight: 0.1 # Temporal smoothness loss
  lpips_weight: 0.2 # Perceptual loss (requires lpips package)
  lpips_net: vgg # Options: vgg, alex, squeeze
  dino_weight: 0.0 # DINOv2 semantic feature loss (0 = disabled)
  dino_model: dinov2_vits14 # Options: dinov2_vits14, dinov2_vitb14, dinov2_vitl14

output:
  save_dir: ckpts/small/attacker_1024_mask_25

eval:
  enabled: true
  h5_path: trajectory_data/small/gradients_test.h5
  num_sequences: 20

wandb:
  enabled: true
  project: gradient-inversion
  name: small_1024_mask_25
  entity: gradinversion
  tags: ["small", "1024-latent", "mask-25"]

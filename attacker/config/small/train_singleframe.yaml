# SingleFrame Baseline Training Configuration
# Usage: uv run -m attacker.training.training.train_singleframe attacker/config/train_singleframe.yaml
#
# Same encoder+decoder as temporal model, but NO causal transformer.
# Trains on the same data for a fair comparison.

device: auto

data:
  h5_path: trajectory_data/small/gradients_train_augmented.h5
  gradient_dim: 936102

model:
  sequence_length: 8
  stride: 4
  latent_dim: 1024
  encoder_type: residual
  decoder_type: residual
  dropout: 0.1

training:
  num_epochs: 50
  batch_size: 2
  accumulation_steps: 8
  learning_rate: 1e-4
  lr_schedule: cosine
  min_lr: 1e-6
  weight_decay: 1e-5
  warmup_epochs: 3
  num_workers: 4

loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.1
  lpips_weight: 0.0

output:
  save_dir: ckpts/small/singleframe

wandb:
  enabled: true
  project: gradient-inversion
  name: small_singleframe
  entity: gradinversion
  tags: ["small", "singleframe"]

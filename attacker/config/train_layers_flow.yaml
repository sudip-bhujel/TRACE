# Temporal Gradient Inversion Training - Flow Matching Decoder
# Uses conditional flow matching instead of deterministic pixel regression
# Usage: python -m attacker.train ./attacker/config/train_layers_flow.yaml

device: auto

data:
  h5_path: trajectory_data/gradients_108_augmented.h5
  # Same layer selection as train_layers.yaml
  gradient_layers:
    # Conv1 (3->32, k=8, s=4)
    - encoder.0.0.weight
    - encoder.0.0.bias
    - encoder.0.2.weight
    - encoder.0.2.bias
    - encoder.0.2.running_var
    - encoder.0.2.running_mean
    # Conv2 (32->64, k=4, s=2)
    - encoder.1.0.weight
    - encoder.1.0.bias
    - encoder.1.2.running_var
    - encoder.1.2.weight
    - encoder.1.2.running_mean
    - encoder.1.2.bias
    # Conv3 (64->64, k=3, s=1)
    - encoder.2.0.weight
    - encoder.2.0.bias
    - encoder.2.2.weight
    - encoder.2.2.bias
    - encoder.2.2.running_var
    # Policy head
    - policy.weight
    - policy.bias
    # Value head
    - value.weight

model:
  sequence_length: 8
  latent_dim: 1024
  stride: 2
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: flow # Flow matching decoder
  encoder_hidden_dims: [4096, 2048, 1024]
  dropout: 0.1
  use_flash_attention: true
  # Flow-specific parameters (passed to FlowImageDecoder via **kwargs)
  base_channels: 64 # U-Net base channels (64 → 128 → 256)
  num_sampling_steps: 20 # ODE integration steps for inference

training:
  num_epochs: 100
  batch_size: 8
  accumulation_steps: 6
  learning_rate: 1e-4
  weight_decay: 1e-5
  num_workers: 4

  lr_schedule: cosine
  warmup_epochs: 5
  min_lr: 1e-6

  gradient_noise_scale: 0.0

loss:
  # Flow matching uses velocity MSE internally — these are ignored except action_weight
  action_weight: 0.1

output:
  save_dir: ckpts/attacker_layers_flow

eval:
  enabled: true
  h5_path: trajectory_data/eval_tf_108.h5
  num_sequences: 20

wandb:
  enabled: true
  project: gradient-inversion
  name: attacker-train-layers-flow
  entity: gradinversion
  tags:
    [
      "layer-selection",
      "80k-dims",
      "encoder+policy+value",
      "1024-latent",
      "flow-matching",
    ]

# Autoregressive Gradient Inversion Evaluation Configuration
# Usage: uv run -m attacker.evaluation.evaluate ./attacker/config/eval.yaml

device: auto

data:
  h5_path: trajectory_data/ppo/gradients_test.h5
  gradient_dim: 936102

model:
  # Architecture must match the trained checkpoint
  model_type: autoregressive
  sequence_length: 8
  stride: 2
  latent_dim: 1024
  num_transformer_layers: 6
  num_heads: 8
  encoder_type: residual
  decoder_type: residual
  use_flash_attention: true

eval:
  checkpoint: ckpts/autoregressive/no_temp/ablation/t8/best_model.pt
  num_sequences: 100
  enable_fid: true
  # false = autoregressive inference (real inference condition)
  # true  = teacher-forced inference (upper-bound / gap measurement)
  teacher_forcing: true

output:
  save_dir: eval_results/autoregressive/no_temp/t8-tf-true

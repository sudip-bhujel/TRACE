# Victim SAC Training Configuration
# Usage: python -m victim.train victim/config/sac/train.yaml

algorithm: sac

environment:
  scenes:
    - "FloorPlan1"
    - "FloorPlan2"
    - "FloorPlan3"
    - "FloorPlan4"
    - "FloorPlan5"
    - "FloorPlan6"
    - "FloorPlan7"
    - "FloorPlan8"
    - "FloorPlan9"
    - "FloorPlan10"
  image_size: [84, 84]
  max_steps: 200
  headless: false

# SAC hyperparameters
sac:
  total_steps: 500000
  batch_size: 256
  buffer_size: 100000
  learning_starts: 5000       # random exploration steps before training
  gamma: 0.99
  tau: 0.005                  # soft target-network update rate
  learning_rate: 3.0e-4
  target_entropy_ratio: 0.50  # target entropy as fraction of log(num_actions)
  train_freq: 1               # gradient updates per env step

training:
  seed: 42
  resume_from: null

output:
  save_dir: "ckpts/victim/sac"
  plot_path: "output/victim_sac_results.png"

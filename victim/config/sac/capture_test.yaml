# SAC gradient capture - test split.
# Usage: python -m victim.capture.capture victim/config/sac/capture_test.yaml

environment:
  scenes: [
      "FloorPlan28", "FloorPlan29", "FloorPlan30",
      "FloorPlan228", "FloorPlan229", "FloorPlan230",
      "FloorPlan328", "FloorPlan329", "FloorPlan330",
      "FloorPlan428", "FloorPlan429", "FloorPlan430",
    ]
  image_size: [84, 84]
  max_steps: 100
  headless: false

model:
  algorithm: sac
  checkpoint: "ckpts/victim/sac/sac_ai2thor_final.pt"
  num_actions: 5

capture:
  steps_per_scene: 1000
  gradient_layers: null
  save_path: "trajectory_data/sac/gradients_test.h5"
  compression: "gzip"
  use_exact_loss: true
  sac_gamma: 0.99
  sac_alpha: 0.2

device: "auto"

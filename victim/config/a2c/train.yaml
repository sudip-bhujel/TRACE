# Victim A2C Training Configuration
# Usage: python -m victim.train victim/config/a2c/train.yaml

algorithm: a2c

environment:
  scenes:
    - "FloorPlan1"
    - "FloorPlan2"
    - "FloorPlan3"
    - "FloorPlan4"
    - "FloorPlan5"
    - "FloorPlan6"
    - "FloorPlan7"
    - "FloorPlan8"
    - "FloorPlan9"
    - "FloorPlan10"
  image_size: [84, 84]
  max_steps: 200
  headless: false

# A2C hyperparameters
a2c:
  total_updates: 5000
  steps_per_update: 512        # rollout length per update
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-4        # lower than before for stability (no clipping safeguard)
  entropy_coef: 0.05           # stronger than PPO's 0.01 to prevent collapse (no clipping)
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  seed: 42
  resume_from: null

output:
  save_dir: "ckpts/victim/a2c"
  plot_path: "output/victim_a2c_results.png"

# A2C Gradient Capture Configuration — Test Split
# Usage: python -m victim.capture victim/config/a2c/capture_test.yaml

environment:
  scenes: [
      # kitchens 28–30
      "FloorPlan28", "FloorPlan29", "FloorPlan30",
      # living rooms 228–230
      "FloorPlan228", "FloorPlan229", "FloorPlan230",
      # bedrooms 328–330
      "FloorPlan328", "FloorPlan329", "FloorPlan330",
      # bathrooms 428–430
      "FloorPlan428", "FloorPlan429", "FloorPlan430",
    ]
  image_size: [84, 84]
  max_steps: 100
  headless: false

model:
  algorithm: a2c
  checkpoint: "ckpts/victim/a2c/a2c_ai2thor_100.pt"
  num_actions: 5

capture:
  steps_per_scene: 1000        # 1000 steps × 12 scenes = 12,000 total
  gradient_layers: null        # null = all layers
  save_path: "trajectory_data/a2c/gradients_test.h5"
  compression: "gzip"
  # Exact A2C loss — episode-buffered GAE, no clipping
  gae_gamma:  0.99
  gae_lambda: 0.95
  vf_coef:    0.5
  ent_coef:   0.01

device: "auto"

# A2C gradient capture - test split.
# Usage: python -m victim.capture.capture victim/config/a2c/capture_test.yaml

environment:
  scenes: [
      "FloorPlan28", "FloorPlan29", "FloorPlan30",
      "FloorPlan228", "FloorPlan229", "FloorPlan230",
      "FloorPlan328", "FloorPlan329", "FloorPlan330",
      "FloorPlan428", "FloorPlan429", "FloorPlan430",
    ]
  image_size: [84, 84]
  max_steps: 100
  headless: false

model:
  algorithm: a2c
  checkpoint: "ckpts/victim/a2c/a2c_ai2thor_100.pt"
  num_actions: 5

capture:
  steps_per_scene: 1000
  gradient_layers: null
  save_path: "trajectory_data/a2c/gradients_test.h5"
  compression: "gzip"
  gae_gamma:  0.99
  gae_lambda: 0.95
  vf_coef:    0.5
  ent_coef:   0.01

device: "auto"

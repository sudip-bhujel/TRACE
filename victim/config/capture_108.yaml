# Model settings
model:
  checkpoint: "ckpts/ppo_5/ppo_ai2thor_1000.pt" # keep this same as ppo_5
  num_actions: 5

# Capture settings
capture:
  num_trajectories: 1080 # Fallback if steps_per_scene not used
  steps_per_scene: 1000 # 1000 steps per scene × 108 scenes = 1,080,000 total (UNIFORM)
  gradient_layers: null # null = all layers
  save_path: "trajectory_data/gradients_108.h5"
  compression: "gzip"
  shuffle_scenes: false # Not used in uniform mode

# Device settings
device: "auto"

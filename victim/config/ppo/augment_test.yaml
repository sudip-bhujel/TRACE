# PPO gradient dataset augmentation - test split.
# Usage: python -m victim.augment.augment victim/config/ppo/augment_test.yaml

algorithm: ppo

model:
  checkpoint: "ckpts/victim/ppo/ppo_ai2thor_final.pt"
  architecture: cnn
  num_actions: 5

data:
  input:      "trajectory_data/ppo/gradients_test.h5"
  output:     "trajectory_data/ppo/gradients_test_augmented.h5"
  seed:       42
  batch_size: 100

augmentation:
  num_augmentations: 2
  brightness:  0.2
  contrast:    0.2
  saturation:  0.2
  hue:         0.1

loss:
  gamma:    0.99
  lam:      0.95
  clip_eps: 0.2
  vf_coef:  0.5
  ent_coef: 0.01

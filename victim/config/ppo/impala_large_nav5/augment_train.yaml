# PPO gradient augmentation for the wider IMPALA/Nav5 training split.
# Usage: uv run -m victim.augment.augment victim/config/ppo/impala_large_nav5/augment_train.yaml

_base_: ../augment_train.yaml

model:
  checkpoint: ckpts/victim/ppo/impala_large_nav5/ppo_ai2thor_final.pt
  architecture: impala_large
  num_actions: 5

data:
  input: trajectory_data/ppo/impala_large_nav5/gradients_train.h5
  output: trajectory_data/ppo/impala_large_nav5/gradients_train_augmented.h5

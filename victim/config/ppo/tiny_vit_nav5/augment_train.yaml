# PPO gradient augmentation for the Tiny-ViT/Nav5 training split.
# Usage: uv run -m victim.augment.augment victim/config/ppo/tiny_vit_nav5/augment_train.yaml

_base_: ../augment_train.yaml

model:
  checkpoint: ckpts/victim/ppo/tiny_vit_nav5/ppo_ai2thor_final.pt
  architecture: tiny_vit
  num_actions: 5

data:
  input: trajectory_data/ppo/tiny_vit_nav5/gradients_train.h5
  output: trajectory_data/ppo/tiny_vit_nav5/gradients_train_augmented.h5

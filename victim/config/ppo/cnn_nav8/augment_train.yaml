# PPO gradient augmentation for the CNN/Nav8 training split.
# Usage: uv run -m victim.augment.augment victim/config/ppo/cnn_nav8/augment_train.yaml

_base_: ../augment_train.yaml

model:
  checkpoint: ckpts/victim/ppo/cnn_nav8/ppo_ai2thor_final.pt
  architecture: cnn
  num_actions: 8

data:
  input: trajectory_data/ppo/cnn_nav8/gradients_train.h5
  output: trajectory_data/ppo/cnn_nav8/gradients_train_augmented.h5

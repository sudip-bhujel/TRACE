# Victim PPO training configuration.
# Usage: python -m victim.training.train victim/config/ppo/train.yaml

algorithm: ppo
device: auto

model:
  architecture: cnn

environment:
  action_set: nav5
  scenes:
    - "FloorPlan1"
    - "FloorPlan2"
    - "FloorPlan3"
    - "FloorPlan4"
    - "FloorPlan5"
    - "FloorPlan6"
    - "FloorPlan7"
    - "FloorPlan8"
    - "FloorPlan9"
    - "FloorPlan10"
  image_size: [84, 84]
  max_steps: 200
  headless: false

ppo:
  total_updates: 500
  steps_per_update: 1024
  mini_batch_size: 64
  ppo_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  learning_rate: 2.5e-4
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  seed: 42
  resume_from: null

output:
  save_dir: "ckpts/victim"
  plot_path: "output/victim_results.png"

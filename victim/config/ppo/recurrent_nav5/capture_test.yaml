# PPO gradient capture for the CNN-GRU/Nav5 held-out test split.
# Usage: uv run -m victim.capture.capture victim/config/ppo/recurrent_nav5/capture_test.yaml

_base_: ../capture_test.yaml

environment:
  action_set: nav5

model:
  checkpoint: ckpts/victim/ppo/recurrent_nav5/ppo_ai2thor_final.pt
  architecture: cnn_gru
  num_actions: 5

capture:
  save_path: trajectory_data/ppo/recurrent_nav5/gradients_test.h5

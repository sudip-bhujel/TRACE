# PPO gradient augmentation for the CNN/Nav10 held-out split.
# Usage: uv run -m victim.augment.augment victim/config/ppo/cnn_nav10/augment_test.yaml

_base_: ../augment_test.yaml

model:
  checkpoint: ckpts/victim/ppo/cnn_nav10/ppo_ai2thor_final.pt
  architecture: cnn
  num_actions: 10

data:
  input: trajectory_data/ppo/cnn_nav10/gradients_test.h5
  output: trajectory_data/ppo/cnn_nav10/gradients_test_augmented.h5

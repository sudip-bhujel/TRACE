# PPO gradient capture - test split.
# Usage: python -m victim.capture.capture victim/config/ppo/capture_test.yaml

environment:
  scenes: [
      "FloorPlan28", "FloorPlan29", "FloorPlan30",
      "FloorPlan228", "FloorPlan229", "FloorPlan230",
      "FloorPlan328", "FloorPlan329", "FloorPlan330",
      "FloorPlan428", "FloorPlan429", "FloorPlan430",
    ]
  image_size: [84, 84]
  max_steps: 100
  headless: false

model:
  checkpoint: "ckpts/victim/ppo_ai2thor_final.pt"
  num_actions: 5

capture:
  num_trajectories: 48
  steps_per_scene: 1000
  gradient_layers: null
  save_path: "trajectory_data/ppo/gradients_test.h5"
  compression: "gzip"
  use_ppo_loss: true
  ppo_clip_eps: 0.2
  ppo_vf_coef: 0.5
  ppo_ent_coef: 0.01
  gae_gamma: 0.99
  gae_lambda: 0.95

device: "auto"

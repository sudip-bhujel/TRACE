# PPO victim training: IMPALA-style residual CNN with five navigation actions.
# Usage: uv run -m victim.training.train victim/config/ppo/impala_nav5/train.yaml

_base_: ../train.yaml

model:
  architecture: impala_cnn

environment:
  action_set: nav5

ppo:
  learning_rate: 1e-4

output:
  save_dir: ckpts/victim/ppo/impala_nav5
  plot_path: output/victim_ppo_impala_nav5.png

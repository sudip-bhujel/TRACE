# PPO gradient augmentation for the RGB + point-goal/Nav5 held-out split.
# Usage: uv run -m victim.augment.augment victim/config/ppo/rgb_goal_nav5/augment_test.yaml

_base_: ../augment_test.yaml

model:
  checkpoint: ckpts/victim/ppo/rgb_goal_nav5/ppo_ai2thor_final.pt
  architecture: cnn_rgb_goal
  num_actions: 5

data:
  input: trajectory_data/ppo/rgb_goal_nav5/gradients_test.h5
  output: trajectory_data/ppo/rgb_goal_nav5/gradients_test_augmented.h5

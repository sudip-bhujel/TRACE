# PPO gradient capture for the RGB + point-goal/Nav5 training split.
# Usage: uv run -m victim.capture.capture victim/config/ppo/rgb_goal_nav5/capture_train.yaml

_base_: ../capture_train.yaml

environment:
  action_set: nav5
  observation_mode: rgb_goal

model:
  checkpoint: ckpts/victim/ppo/rgb_goal_nav5/ppo_ai2thor_final.pt
  architecture: cnn_rgb_goal
  num_actions: 5

capture:
  save_path: trajectory_data/ppo/rgb_goal_nav5/gradients_train.h5

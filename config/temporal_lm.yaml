# Configuration for Temporal Gradient Inversion Training
# Usage: uv run -m ppo.attacker_temporal --config ppo/config_temporal.yaml

# Data settings
data:
  h5_path: "trajectory_data/gradients.h5"
  gradient_dim: 262144 # 262K dimensions

# Model settings
model:
  sequence_length: 8 # T frames per sequence
  stride: 4 # Overlap between sequences
  latent_dim: 512
  num_transformer_layers: 4
  num_heads: 8
  encoder_hidden_dims: [4096, 2048, 1024]
  dropout: 0.1

# Loss settings
loss:
  mse_weight: 1.0
  l1_weight: 0.5
  action_weight: 0.1
  perceptual_weight: 0.05 # Reduced to prevent hallucination
  perceptual_layers: ["relu1_2", "relu2_2"] # Shallower layers

# Training settings
training:
  num_epochs: 50
  batch_size: 2 # Small batch for sequences
  accumulation_steps: 8 # Effective batch = 2 * 8 = 16
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  temporal_weight: 0.1 # Penalize sudden frame-to-frame changes

# Output settings
output:
  save_dir: "ckpts/attacker_temporal_lm"
  save_reconstructions_every: 5

# Device settings
device: "auto" # "auto", "cuda", "mps", "cpu"

# Configuration for Gradient Inversion Training
# Usage: uv run -m ppo.attacker_tf --config ppo/config.yaml

# Data settings
data:
  h5_path: "trajectory_data/gradients.h5"
  gradient_dim: 131072 # 131K, 262144, 524288, or null for full

# Model settings
model:
  latent_dim: 512
  use_transformer: false
  encoder_hidden_dims: [4096, 2048, 1024]
  dropout: 0.1

# Loss settings
loss:
  # Pixel losses
  mse_weight: 1.0
  l1_weight: 0.5

  # Action prediction
  action_weight: 0.1

  # Perceptual loss (VGG features)
  perceptual_weight: 0.1 # Set to 0 to disable
  perceptual_layers: ["relu1_2", "relu2_2", "relu3_3", "relu4_3"]

  # SSIM loss
  ssim_weight: 0.0 # Set > 0 to enable

# Training settings
training:
  num_epochs: 50
  batch_size: 4
  accumulation_steps: 8 # Effective batch = batch_size * accumulation_steps
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5

# Output settings
output:
  save_dir: "ckpts/attacker_131072_notf"
  log_interval: 5
  save_reconstructions_every: 5

# Device settings
device: "auto" # "auto", "cuda", "mps", "cpu"

# Configuration for Temporal Model Evaluation
# Usage: uv run -m ppo.evaluate_temporal --config config/eval_temporal.yaml

# Data settings
data:
  h5_path: "trajectory_data/test_gradients.h5"
  gradient_dim: 262144 # null = use all available dimensions

# Model settings (must match training config)
model:
  sequence_length: 8
  stride: 8 # Non-overlapping for test evaluation
  latent_dim: 512
  num_transformer_layers: 4
  num_heads: 8

# Evaluation settings
eval:
  checkpoint: "ckpts/attacker_temporal_lm/best_model.pt"
  num_sequences: 5 # Number of sequences to visualize

# Output settings
output:
  save_dir: "eval_results/temporal"

# Device settings
device: "auto"

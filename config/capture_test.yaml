# Configuration for Test Data Capture
# Usage: uv run -m ppo.capture_gradients --config config/capture_test.yaml

# Environment settings
environment:
  scene: "FloorPlan2" # Different from training (FloorPlan1)
  image_size: [84, 84]
  max_steps: 200
  headless: false # Mac requires display, can't run headless

# Model settings
model:
  checkpoint: "ckpts/ppo_ai2thor_final.pt"
  num_actions: 5

# Capture settings
capture:
  num_trajectories: 12 # Small test set
  gradient_layers: null # null = all layers
  save_path: "trajectory_data/test_gradients.h5"
  compression: "gzip"

# Device settings
device: "auto"
